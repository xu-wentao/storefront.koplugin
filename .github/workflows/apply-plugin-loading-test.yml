name: Publish Storefront API Fallback Test 5

on:
  push:
    branches:
      - 'test/plugin-loading-status'
    paths:
      - '.github/workflows/apply-plugin-loading-test.yml'
      - 'storefront.koplugin/_meta.lua'
      - 'storefront.koplugin/main.lua'
      - 'storefront.koplugin/storefront_about_dialog.lua'
      - 'storefront.koplugin/storefront_match.lua'
      - 'storefront.koplugin/storefront_update_source.lua'
      - 'storefront.koplugin/storefront_net_github.lua'
      - 'storefront.koplugin/storefront_release_fallback.lua'
      - 'storefront.koplugin/storefront_screensaver_mgr.lua'
      - 'storefront.koplugin/storefront_screensavers_ui.lua'
      - 'storefront.koplugin/screensavers_catalog.json'
      - 'tests/test_storefront.lua'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/plugin-loading-status
          fetch-depth: 0

      - name: Validate test update source
        run: |
          grep -q 'version = "26.8.27-beta2-loading-status-test5"' storefront.koplugin/_meta.lua
          grep -q 'full_name = "xu-wentao/storefront.koplugin"' storefront.koplugin/storefront_update_source.lua
          grep -q 'allow_prerelease = true' storefront.koplugin/storefront_update_source.lua
          python3 -c 'import json; data=json.load(open("storefront.koplugin/screensavers_catalog.json")); assert len(data) >= 455'

      - name: Validate Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find storefront.koplugin -name '*.lua' -exec luac -p {} +

      - name: Run Storefront tests
        run: lua5.1 tests/test_storefront.lua

      - name: Package plugin
        run: zip -r storefront.koplugin.zip storefront.koplugin -x '*.git*' '*/.*'

      - name: Publish test5 prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: 26.8.27-beta2-loading-status-test5
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" storefront.koplugin.zip --clobber
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release create "$TAG" storefront.koplugin.zip \
              --target "$GITHUB_SHA" \
              --title 'Storefront API fallback test 5' \
              --notes 'Test build: falls back to the public GitHub Releases Atom feed when api.github.com is unavailable, reconstructs the Storefront ZIP asset URL for installation, keeps prerelease updates enabled, and includes the screensaver catalog and download fixes from test4.' \
              --prerelease
          fi
